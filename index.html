 const th=cr?"<th>Punkte</th>":m=="121"?"<th>Höchste Zahl</th><th>Checks</th><th>Quote</th><th>Beste Serie</th>":m=="170"?"<th>Geschafft</th><th>Quote</th><th>T20</th><th>Bull</th><th>2 von 3</th>":"<th>Legs</th><th>Ø</th><th>180</th><th>100+</th><th>Höchste</th>";
 const pc=(a,b)=>b?Math.round(100*a/b)+"%":"–";
 const row=q=>cr?`<td>${q.pts}</td>`:m=="121"?`<td>${q.best||"–"}</td><td>${q.ok}/${q.att}</td><td>${pc(q.ok,q.att)}</td><td>${q.mstreak}</td>`:m=="170"?`<td>${q.comp}/${q.att}</td><td>${pc(q.comp,q.att)}</td><td>${pc(q.t20h,q.t20n)}</td><td>${pc(q.bh,q.bn)}</td><td>${q.two}</td>`:`<td>${q.legs}</td><td>${avg3(q)}</td><td>${q.n180}</td><td>${q.n100}</td><td>${q.hi}</td>`;
 const none=(m=="121"&&!w.ok)||(m=="170"&&!w.comp);
 return `<div class="card" style="text-align:center"><div class="big">${none?"🎯":"🏆"}</div><h2>${none?"Auswertung":esc(w.name)+" gewinnt!"}</h2></div>
 <div class="card scroll"><table><tr><th>Spieler</th>${th}</tr>${g.pl.map(q=>`<tr><td>${esc(q.name)}</td>${row(q)}</tr>`).join("")}</table></div>
 <div class="row"><button class="b" onclick="scStart()">🔁 Nochmal</button><button class="b g" onclick="G=null;draw()">Neues Spiel</button><button class="b g" onclick="undo()">↶ Letzten Wurf zurück</button></div>`}
/* Cricket */
function crWin(){for(let i=0;i<G.pl.length;i++){const p=G.pl[i];if(CN.every(n=>p.m[n]>=3)&&G.pl.every(o=>o===p||o.pts<=p.pts))return i}return -1}
function crMarks(p,n,k){for(let i=0;i<k;i++){if(p.m[n]<3)p.m[n]++;else if(G.pl.some(o=>o!==p&&o.m[n]<3))p.pts+=n}}
function crAfter(){const w=crWin();if(w>=0){G.over=true;G.win=w;draw();return true}if(G.d>=3){G.d=0;G.cur=(G.cur+1)%G.pl.length}draw();return false}
function crHit(n,k){const p=G.pl[G.cur];snap();crMarks(p,n,k);G.d++;G.msg=`${p.name}: ${n==25?"Bull":n} ×${k}`;crAfter()}
function crMiss(){const p=G.pl[G.cur];snap();G.d++;G.msg=`${p.name}: daneben`;crAfter()}
function crEnd(){snap();G.d=0;G.cur=(G.cur+1)%G.pl.length;draw()}
function crBot(){const p=G.pl[G.cur],a=p.bot,acc=.28+(a-40)/50*.37,log=[];snap();
 for(let i=0;i<3&&!G.over;i++){let tg=CN.find(n=>p.m[n]<3);if(!tg)tg=CN.filter(n=>G.pl.some(o=>o!==p&&o.m[n]<3)).sort((x,y)=>y-x)[0];if(!tg)break;
  if(Math.random()<acc){const r=Math.random(),pt=(a-30)/400;let k=r<pt?3:r<pt+.08?2:1;if(tg==25&&k==3)k=2;crMarks(p,tg,k);log.push((tg==25?"Bull":tg)+"×"+k)}else log.push("daneben");
  if(crWin()>=0)break}
 G.msg=`${p.name}: ${log.join(", ")||"–"}`;G.d=3;crAfter()}
function crView(){const g=G,p=g.pl[g.cur],sym=["","⁄","✕","⊗"];
 const tbl=`<div class="card scroll"><table class="ct"><tr><th></th>${g.pl.map((q,i)=>`<th class="${i==g.cur?"cur":""}">${esc(q.name)}${q.bot?" 🤖":""}</th>`).join("")}</tr>
 ${CN.map(n=>`<tr><td><b>${n==25?"Bull":n}</b></td>${g.pl.map((q,i)=>`<td class="${i==g.cur?"cur":""}"><span style="font-size:22px">${sym[q.m[n]]||"·"}</span></td>`).join("")}</tr>`).join("")}
 <tr><td><b>Punkte</b></td>${g.pl.map((q,i)=>`<td class="${i==g.cur?"cur":""}"><b>${q.pts}</b></td>`).join("")}</tr></table></div>`;
 let inp;
 if(p.bot){inp=`<div class="card"><b>🤖 ${esc(p.name)} wirft …</b></div>`;botSched()}
 else inp=`<div class="card"><div class="row" style="margin:0"><b>${esc(p.name)}</b><span class="mu">Dart ${g.d+1} von 3</span></div>
  ${CN.map(n=>`<div class="crr"><b>${n==25?"Bull":n}</b><button class="b g" onclick="crHit(${n},1)">1×</button><button class="b g" ${n==25?'style="grid-column:span 2"':""} onclick="crHit(${n},2)">Double</button>${n==25?"":`<button class="b g" onclick="crHit(${n},3)">Triple</button>`}</div>`).join("")}
  <div class="row"><button class="b g" onclick="crMiss()">Daneben</button><button class="b" onclick="crEnd()">Zug beenden ▶</button></div></div>`;
 return tbl+(g.msg?`<div class="card" style="padding:8px 12px">${esc(g.msg)}</div>`:"")+inp}
function Minispiele(){
 const nv=`<div class="row">${[["sc","🎯 Dartscorer"],["qz","❓ Dart-Quiz"]].map(([k,l])=>`<button class="b ${MG==k?"":"g"}" onclick="MG='${k}';MQ=null;draw()">${l}</button>`).join("")}</div>`;
 if(MG=="sc")return nv+(G?scPlay():scSetup());
 if(!MQ)MQ=genQz();const st=MS.qz;
 return nv+`<div class="card"><div class="mu">Serie ${st.s} · Rekord ${st.b}</div><div style="font-size:20px;font-weight:700;margin:8px 0">${MQ.q}</div>
 ${MQ.opts.map((o,i)=>`<button class="b g opt" id="o${i}" onclick="ans(${i})">${esc(o)}</button>`).join("")}<div id="fb" style="margin:8px 0"></div><button class="b hide" id="nx" onclick="MQ=null;draw()">Weiter ▶</button></div>`}
function ans(i){if(MQ.done)return;MQ.done=1;const st=MS.qz,ok=i==MQ.a,g=$("#o"+MQ.a);
 if(ok){st.s++;st.b=Math.max(st.b,st.s)}else{st.s=0;const w=$("#o"+i);w.style.background="var(--no)";w.style.color="#fff"}
 g.style.background="var(--ok)";g.style.color="#fff";
 $("#fb").innerHTML=ok?`<b class="ok">Richtig! 🎯</b>`:`<b class="no">Leider nein.</b> ${esc(MQ.why(MQ.opts[i]))} Richtig: <b>${esc(MQ.good)}</b>`;
 if(ok)setTimeout(()=>{if(tab=="Minispiele"&&MQ&&MQ.done){MQ=null;draw()}},1000);else $("#nx").classList.remove("hide")}
nav();init();
</script></body></html>
